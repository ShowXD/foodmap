<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d9480f">
  <meta name="robots" content="noindex">
  <title>美食地圖・網站管理</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>網站管理</h1>
    <a href="/">← 回美食地圖</a>
  </header>
  <main>
    <p id="admin-message" role="status">載入中…</p>

    <h2 class="section-title">群組</h2>
    <form id="create-group-form" class="inline-form">
      <input name="name" required maxlength="50" placeholder="群組名稱，例如：家人" aria-label="群組名稱">
      <input name="owner_email" type="email" placeholder="擁有者 email（空白＝你自己）" aria-label="擁有者 email">
      <button type="submit">建立</button>
    </form>
    <ul id="group-list" class="user-list"></ul>

    <h2 class="section-title">LINE 群組</h2>
    <p class="meta">Bot 加入群組後會出現在這裡。綁定到清單後，群組裡的 IG/FB 連結才會自動收進該清單；沒綁定的群組一律不收。</p>
    <ul id="line-group-list" class="user-list"></ul>

    <h2 class="section-title">帳號</h2>
    <ul id="user-list" class="user-list"></ul>
  </main>
  <script src="admin.js" type="module"></script>
</body>
</html>
