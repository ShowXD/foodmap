<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d9480f">
  <meta name="robots" content="noindex">
  <title>美食地圖・登入</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; --bg: #fffaf5; --card: #fff; --text: #212529; --muted: #6c757d; --accent: #d9480f; --border: #e9ecef; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1a1a1a; --card: #262626; --text: #f1f3f5; --muted: #adb5bd; --accent: #ff8a50; --border: #3a3a3a; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text); }
    form { width: min(320px, calc(100vw - 32px)); display: grid; gap: 12px; padding: 24px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
    h1 { margin: 0; font-size: 1.25rem; color: var(--accent); }
    input, button { font: inherit; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
    button { background: var(--accent); color: #fff; border: none; cursor: pointer; }
    #error { margin: 0; color: #e03131; }
  </style>
</head>
<body>
  <form method="post" action="/api/login">
    <h1>美食地圖</h1>
    <label for="password">家庭密碼</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">登入</button>
    <p id="error" role="alert" hidden>密碼不對，再試一次</p>
  </form>
  <script>
    if (new URLSearchParams(location.search).has('error')) document.getElementById('error').hidden = false;
  </script>
</body>
</html>
