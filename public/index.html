<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d9480f">
  <title>美食地圖</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body data-view="map">
  <header class="topbar">
    <a class="list-name" href="#me" id="current-list-name" aria-label="目前清單，點我切換">美食地圖</a>
  </header>

  <main>
    <section class="view" data-view="map" aria-label="地圖">
      <div class="map-placeholder">
        <p class="big-emoji" aria-hidden="true">🗺️</p>
        <p>地圖功能即將推出，接上 Google 地圖後就會顯示所有店家和你的位置。</p>
        <button id="random-pick" type="button">🎲 今天吃什麼</button>
        <p class="meta">從還沒吃過的店裡隨機抽一家</p>
        <ul id="random-result" class="place-list"></ul>
      </div>
    </section>

    <section class="view" data-view="list" aria-label="清單">
      <input id="search" type="search" placeholder="搜尋店名、食物、地區、標籤…" aria-label="搜尋">
      <div id="filter-chips" class="chips" role="group" aria-label="篩選"></div>
      <p id="list-message" role="status"></p>
      <ul id="place-list" class="place-list"></ul>
    </section>

    <section class="view" data-view="add" aria-label="新增店家">
      <h2 id="add-title" class="view-title">新增店家</h2>
      <form id="add-form">
        <input name="source" type="hidden" value="manual">
        <input name="id" type="hidden" value="">
        <label>影片連結 <input name="url" type="url" required placeholder="貼上 IG / FB / Threads 連結"></label>
        <button id="ai-fill" type="button" class="secondary">✨ AI 自動填入（抓不到時先貼上貼文文字）</button>
        <fieldset id="ai-candidates" hidden>
          <legend>AI 找到好幾家店，勾選要存的</legend>
          <div id="candidate-list"></div>
          <button id="save-candidates" type="button">儲存勾選的店家</button>
        </fieldset>
        <label>店名 <input name="name"></label>
        <label>食物 <input name="dishes" placeholder="牛肉麵、滷味"></label>
        <label>地區 <input name="area" placeholder="台北 大安"></label>
        <label>地址 <input name="address"></label>
        <label>標籤 <input name="tags" placeholder="宵夜 平價"></label>
        <label>貼文文字 <textarea name="caption" rows="3"></textarea></label>
        <label>備註 <textarea name="note" rows="2"></textarea></label>
        <button type="submit">儲存</button>
        <button id="cancel-edit" type="button" class="secondary" hidden>取消編輯</button>
        <p id="form-message" role="status"></p>
      </form>
    </section>

    <section class="view" data-view="me" aria-label="我的">
      <h2 class="view-title">我的</h2>
      <p class="meta">登入帳號：<span id="user-email"></span></p>
      <label>目前清單 <select id="list-select" aria-label="切換清單"></select></label>
      <nav class="menu">
        <a id="members-link" href="/members" hidden>👥 群組成員</a>
        <a id="export-link" href="/api/export" download>⬇️ 匯出這份清單（CSV）</a>
        <a id="admin-link" href="/admin" hidden>⚙️ 網站管理</a>
        <a href="/cdn-cgi/access/logout">🚪 登出</a>
      </nav>
    </section>
  </main>

  <nav class="tabbar" aria-label="主選單">
    <a href="#map" data-tab="map"><span aria-hidden="true">🗺️</span>地圖</a>
    <a href="#list" data-tab="list"><span aria-hidden="true">📋</span>清單</a>
    <a href="#add" data-tab="add" class="tab-add" aria-label="新增店家"><span aria-hidden="true">＋</span></a>
    <a href="#me" data-tab="me"><span aria-hidden="true">👤</span>我的</a>
  </nav>

  <dialog id="visit-dialog">
    <form method="dialog" id="visit-form">
      <h2 id="visit-title">吃過了</h2>
      <fieldset class="rating" aria-label="評分">
        <legend>評分（可不填）</legend>
        <label><input type="radio" name="rating" value="1">1</label>
        <label><input type="radio" name="rating" value="2">2</label>
        <label><input type="radio" name="rating" value="3">3</label>
        <label><input type="radio" name="rating" value="4">4</label>
        <label><input type="radio" name="rating" value="5">5</label>
      </fieldset>
      <label>心得（家人看得到） <textarea name="note" rows="3" maxlength="500"></textarea></label>
      <ul id="visit-others" class="others"></ul>
      <div class="actions">
        <button value="save">儲存</button>
        <button value="remove" class="secondary" id="visit-remove">取消吃過</button>
        <button value="cancel" class="secondary" formnovalidate>關閉</button>
      </div>
    </form>
  </dialog>

  <template id="place-template">
    <li class="place">
      <div class="place-head">
        <h2 class="name"></h2>
        <span class="badge-new" hidden>新</span>
        <button class="star" type="button" aria-label="想吃"></button>
      </div>
      <p class="dishes"></p>
      <p class="meta"></p>
      <p class="family"></p>
      <p class="note"></p>
      <div class="actions">
        <a class="video" target="_blank" rel="noopener noreferrer">影片</a>
        <a class="maps" target="_blank" rel="noopener noreferrer">導航</a>
        <button class="visit" type="button"></button>
        <button class="share secondary" type="button">分享</button>
        <button class="edit secondary" type="button">編輯</button>
      </div>
    </li>
  </template>

  <script src="app.js" type="module"></script>
</body>
</html>
