<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffaf5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
  <title>美食地圖</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body data-view="map">
  <main>
    <section class="view" data-view="map" aria-label="地圖">
      <div class="map-frame"><div id="map" class="map" hidden></div></div>
      <div id="map-fallback" class="map-placeholder">
        <p class="big-emoji" aria-hidden="true">🗺️</p>
        <p id="map-fallback-text">地圖載入中…</p>
      </div>
      <div id="map-chips" class="chips map-chips" role="group" aria-label="地圖篩選"></div>
      <div id="drag-bar" class="map-sheet drag-bar" hidden>
        <p>拖曳標點，或點地圖，把位置放到店家門口</p>
        <div class="actions">
          <button id="drag-save" type="button">儲存位置</button>
          <button id="drag-cancel" type="button" class="secondary">取消</button>
        </div>
      </div>
      <div id="map-card" class="map-sheet" hidden>
        <button id="map-card-close" type="button" class="close" aria-label="關閉卡片">✕</button>
        <ul class="place-list"></ul>
      </div>
      <div class="map-controls">
        <button id="fit-all" type="button" class="map-button" aria-label="顯示全部店家" title="顯示全部店家">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button id="locate-me" type="button" class="map-button" aria-label="回到我的位置" title="回到我的位置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5" fill="currentColor"/><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
    </section>

    <section class="view" data-view="list" aria-label="清單">
      <input id="search" type="search" placeholder="搜尋店名、食物、地區、標籤…" aria-label="搜尋">
      <div id="filter-chips" class="chips" role="group" aria-label="篩選"></div>
      <p id="list-message" role="status"></p>
      <ul id="place-list" class="place-list"></ul>
    </section>

    <section class="view" data-view="add" aria-label="新增店家">
      <h2 id="add-title" class="view-title">新增店家</h2>
      <form id="add-form">
        <input name="source" type="hidden" value="manual">
        <input name="id" type="hidden" value="">
        <label>影片連結 <input name="url" type="url" required placeholder="貼上 IG / FB / Threads 連結"></label>
        <button id="ai-fill" type="button" class="secondary">✨ AI 自動填入（抓不到時先貼上貼文文字）</button>
        <fieldset id="ai-candidates" hidden>
          <legend>AI 找到好幾家店，勾選要存的</legend>
          <div id="candidate-list"></div>
          <button id="save-candidates" type="button">儲存勾選的店家</button>
        </fieldset>
        <label>店名 <input name="name"></label>
        <label>食物 <input name="dishes" placeholder="牛肉麵、滷味"></label>
        <label>地區 <input name="area" placeholder="台北 大安"></label>
        <label>地址 <input name="address"></label>
        <label>標籤 <input name="tags" placeholder="宵夜 平價"></label>
        <label>貼文文字 <textarea name="caption" rows="3"></textarea></label>
        <label>備註 <textarea name="note" rows="2"></textarea></label>
        <button type="submit">儲存</button>
        <button id="cancel-edit" type="button" class="secondary" hidden>取消編輯</button>
        <p id="form-message" role="status"></p>
      </form>
    </section>

    <section class="view" data-view="random" aria-label="今天吃什麼">
      <h2 class="view-title">今天吃什麼？</h2>
      <label>距離
        <select id="random-radius">
          <option value="1">1 公里內</option>
          <option value="3">3 公里內</option>
          <option value="5" selected>5 公里內</option>
          <option value="10">10 公里內</option>
          <option value="0">不限</option>
        </select>
      </label>
      <label>標籤 <select id="random-tag"><option value="">全部</option></select></label>
      <label class="checkbox-label"><input id="random-include-visited" type="checkbox"> 也抽我吃過的店</label>
      <button id="random-pick" type="button" class="random-big">🎲 抽一家</button>
      <p id="random-message" class="meta" role="status"></p>
      <ul id="random-result" class="place-list"></ul>
      <button id="random-on-map" type="button" class="secondary" hidden>在地圖上看</button>
    </section>

    <section class="view" data-view="me" aria-label="我的">
      <h2 class="view-title">我的</h2>
      <p class="meta">登入帳號：<span id="user-email"></span></p>
      <label>目前清單 <select id="list-select" aria-label="切換清單"></select></label>
      <nav class="menu">
        <a id="members-link" href="/members" hidden>👥 群組成員</a>
        <a id="export-link" href="/api/export" download>⬇️ 匯出這份清單（CSV）</a>
        <a id="admin-link" href="/admin" hidden>⚙️ 網站管理</a>
        <a href="/cdn-cgi/access/logout">🚪 登出</a>
      </nav>
    </section>
  </main>

  <nav class="tabbar" aria-label="主選單">
    <a href="#map" data-tab="map"><span aria-hidden="true">🗺️</span>地圖</a>
    <a href="#list" data-tab="list"><span aria-hidden="true">📋</span>清單</a>
    <a href="#add" data-tab="add" class="tab-add" aria-label="新增店家"><span aria-hidden="true">＋</span></a>
    <a href="#random" data-tab="random"><span aria-hidden="true">🎲</span>吃什麼</a>
    <a href="#me" data-tab="me"><span aria-hidden="true">👤</span>我的</a>
  </nav>

  <dialog id="visit-dialog">
    <form method="dialog" id="visit-form">
      <h2 id="visit-title">吃過了</h2>
      <fieldset class="rating" aria-label="評分">
        <legend>評分（可不填）</legend>
        <label><input type="radio" name="rating" value="1">1</label>
        <label><input type="radio" name="rating" value="2">2</label>
        <label><input type="radio" name="rating" value="3">3</label>
        <label><input type="radio" name="rating" value="4">4</label>
        <label><input type="radio" name="rating" value="5">5</label>
      </fieldset>
      <label>心得（家人看得到） <textarea name="note" rows="3" maxlength="500"></textarea></label>
      <ul id="visit-others" class="others"></ul>
      <div class="actions">
        <button value="save">儲存</button>
        <button value="remove" class="secondary" id="visit-remove">取消吃過</button>
        <button value="cancel" class="secondary" formnovalidate>關閉</button>
      </div>
    </form>
  </dialog>

  <dialog id="locate-dialog">
    <form method="dialog" id="locate-form">
      <h2 id="locate-title">店在哪裡？</h2>
      <div class="inline-form">
        <input name="query" aria-label="搜尋文字" maxlength="100">
        <button value="search">搜尋</button>
      </div>
      <ul id="locate-candidates" class="candidates"></ul>
      <p id="locate-message" class="meta" role="status"></p>
      <p class="meta attribution">搜尋結果由 Google 地圖提供</p>
      <div class="actions">
        <button value="manual" class="secondary">自己在地圖上放</button>
        <button value="cancel" class="secondary">關閉</button>
      </div>
    </form>
  </dialog>

  <template id="place-template">
    <li class="place">
      <div class="place-head">
        <h2 class="name"></h2>
        <span class="badge-new" hidden>新</span>
        <button class="star" type="button" aria-label="想吃"></button>
      </div>
      <p class="dishes"></p>
      <p class="meta"></p>
      <p class="family"></p>
      <p class="note"></p>
      <div class="actions">
        <a class="video" target="_blank" rel="noopener noreferrer">影片</a>
        <a class="maps" target="_blank" rel="noopener noreferrer">導航</a>
        <button class="visit" type="button"></button>
        <button class="locate secondary" type="button"></button>
        <button class="share secondary" type="button">分享</button>
        <button class="edit secondary" type="button">編輯</button>
      </div>
    </li>
  </template>

  <script src="app.js" type="module"></script>
</body>
</html>
