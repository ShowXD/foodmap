<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <title>美食地圖・群組成員</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="group-title">群組成員</h1>
    <a href="/">← 回美食地圖</a>
  </header>
  <main>
    <form id="add-member-form" class="inline-form" hidden>
      <input name="email" type="email" required placeholder="輸入對方登入用的 email" aria-label="成員 email">
      <label id="owner-option" class="checkbox-label" hidden><input name="is_owner" type="checkbox"> 設為擁有者</label>
      <button type="submit">加入</button>
    </form>
    <p id="members-message" role="status">載入中…</p>
    <ul id="member-list" class="user-list"></ul>
  </main>
  <script src="members.js" type="module"></script>
</body>
</html>
